<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070f"/>
      <stop offset="1" stop-color="#0d0f26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="glowP" cx="12%" cy="6%" r="55%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="92%" cy="96%" r="55%">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7C3AED" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowP)"/>
  <rect width="1200" height="630" fill="url(#glowC)"/>
  <rect width="1200" height="8" fill="url(#accent)"/>

  <!-- Logo -->
  <rect x="80" y="70" width="86" height="86" rx="20" fill="url(#accent)"/>
  <g stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.92" fill="#ffffff">
    <line x1="108" y1="98" x2="140" y2="102" stroke-opacity="0.85"/>
    <line x1="140" y1="102" x2="122" y2="132" stroke-opacity="0.85"/>
    <line x1="122" y1="132" x2="108" y2="98" stroke-opacity="0.85"/>
    <line x1="124" y1="112" x2="108" y2="98" stroke-opacity="0.7"/>
    <line x1="124" y1="112" x2="140" y2="102" stroke-opacity="0.7"/>
    <line x1="124" y1="112" x2="122" y2="132" stroke-opacity="0.7"/>
    <circle cx="108" cy="98" r="6"/>
    <circle cx="140" cy="102" r="6"/>
    <circle cx="122" cy="132" r="6"/>
    <circle cx="124" cy="112" r="7"/>
  </g>

  <!-- Wordmark -->
  <text x="186" y="112" font-size="38" font-weight="800" fill="#ffffff">AI Magic Mastery</text>
  <text x="188" y="144" font-size="19" font-weight="500" fill="#67E8F9">by CodeBeez × Abid Redwan</text>

  <!-- Headline -->
  <text x="80" y="302" font-size="82" font-weight="800" fill="#ffffff">Master AI.</text>
  <text x="80" y="398" font-size="82" font-weight="800" fill="url(#grad)">Everything. Free.</text>

  <!-- Sub -->
  <text x="82" y="452" font-size="25" font-weight="400" fill="#94A3B8">The most comprehensive open-source AI learning repository.</text>

  <!-- Stat chips -->
  <g font-size="22" font-weight="600" fill="#E9D5FF">
    <rect x="80"  y="506" width="170" height="50" rx="25" fill="#7C3AED" fill-opacity="0.14" stroke="#7C3AED" stroke-opacity="0.45"/>
    <text x="102" y="538">6 Roadmaps</text>
    <rect x="266" y="506" width="262" height="50" rx="25" fill="#7C3AED" fill-opacity="0.14" stroke="#7C3AED" stroke-opacity="0.45"/>
    <text x="288" y="538">Curated Resources</text>
    <rect x="544" y="506" width="180" height="50" rx="25" fill="#7C3AED" fill-opacity="0.14" stroke="#7C3AED" stroke-opacity="0.45"/>
    <text x="566" y="538">25+ Projects</text>
    <rect x="740" y="506" width="250" height="50" rx="25" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="762" y="538" fill="#A7F3D0">100% Free &amp; Open</text>
  </g>

  <!-- Footer handle -->
  <text x="1120" y="600" text-anchor="end" font-size="20" font-weight="500" fill="#475569">github.com/aredwan-xyz</text>
</svg>
